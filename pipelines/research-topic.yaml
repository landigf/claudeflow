# Pipeline: research-topic
# Research a topic using built-in web search plus ClaudeFlow synthesis.
# Uses the autoresearch insight: structured research with sources beats ad-hoc chatting.
#
# Run: npx claudeflow run pipelines/research-topic.yaml --input '{"topic": "..."}'

name: research-topic
description: Deep research on any topic — gather sources, analyze, compare, report
version: "1.0.0"

steps:
  - id: gather-sources
    tool: web
    action: research
    params:
      query: "{topic}"
      topK: 6
      fetchTopK: 4
      maxCharsPerPage: 5000

  - id: analyze
    prompt: |
      Research this topic thoroughly: {topic}

      Search results with links:
      {gather-sources.results}

      Fetched source excerpts and page text:
      {gather-sources.sources}

      Build a grounded synthesis:
      1. Identify the top 5 most relevant papers, tools, or resources
      2. Extract key concepts and terminology
      3. Describe the current state of the art
      4. Note known limitations and open problems
      5. Keep source links in the findings
    output:
      resources:
        type: array
        items: string
      key_concepts:
        type: array
        items: string
      state_of_art: string

  - id: compare
    prompt: |
      Compare the approaches found in the research:
      {analyze.resources}

      Create a comparison table with:
      - Approach name
      - Strengths
      - Weaknesses
      - Best suited for (use case)
      - Maturity level (experimental / production / deprecated)
    output:
      comparison_table: string
      best_overall: string
      best_for_beginners: string

  - id: report
    prompt: |
      Write a structured research report on: {topic}

      Use these findings:
      Key concepts: {analyze.key_concepts}
      State of the art: {analyze.state_of_art}
      Comparison: {compare.comparison_table}
      Best overall: {compare.best_overall}
      Source links: {gather-sources.links}

      Format as a professional report with:
      - Executive summary (3 sentences)
      - Background
      - Analysis
      - Comparison table
      - Recommendations
      - References
    output:
      report: string
      executive_summary: string
      references:
        type: array
        items: string
